<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ระบบบันทึกภารกิจ - แผนกสื่อสาร หน่วยบัญชาการอากาศโยธิน</title>
    <!-- Google Fonts: Sarabun & Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-900 min-h-screen font-['Prompt',sans-serif] antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <!-- Loading Animation (Shows while React & API are loading) -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Prompt', sans-serif; background-color: #f1f5f9;">
        <div style="font-size: 64px; animation: bounce 1s infinite, glow 1.5s ease-in-out infinite alternate;">⚡</div>
        <div style="margin-top: 24px; font-size: 22px; font-weight: 600; color: #1e3a8a; animation: pulse 1.5s infinite;">กำลังโหลดข้อมูล...</div>
        <div style="margin-top: 8px; font-size: 14px; color: #64748b; animation: pulse 1.5s infinite;">ระบบกำลังปลุกเซิร์ฟเวอร์ (อาจใช้เวลา 30-50 วินาที)</div>
        <style>
          @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
          }
          @keyframes glow {
            from { filter: drop-shadow(0 0 5px #fbbf24); }
            to { filter: drop-shadow(0 0 25px #f59e0b); }
          }
          @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
